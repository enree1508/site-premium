<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SST Premium</title></head><body>
<title>SST Premium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Mesmo padrão do painel de Propostas Comerciais: limpo, claro, barra branca com a logo, abas, números, cartões e tabelas. Layout largo. */
:root{
  --bg:#F8F9FB; --surface:#FFFFFF; --ink:#202124; --muted:#5F6368; --line:#E3E5E8; --hover:#F1F3F4;
  --brand:#2E2A45; --accent:#1163B0; --accent-soft:#D6E4F3;
  --ok:#188038; --ok-bg:#E6F4EA; --warn:#8A5A00; --warn-bg:#FEF3C7; --bad:#C5221F; --bad-bg:#FCE8E6; --none:#5F6368; --none-bg:#F1F3F4;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brandrow img{height:44px;width:auto;display:block}
.brandrow h1{margin:0;font-size:18px;font-weight:400;color:var(--muted);padding-left:16px;border-left:1px solid var(--line);white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav.tabs button{border:0;background:transparent;padding:12px 16px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink);background:var(--hover)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:24px 60px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px}
h2{font-size:20px;font-weight:500;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:500;margin:0 0 10px;color:var(--ink)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500;background:var(--surface);color:var(--accent);font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.search{border-radius:999px;background:var(--surface);padding:8px 16px;width:280px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .lbl::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.kpi.bad .lbl::before{background:var(--bad)} .kpi.warn .lbl::before{background:#E0A800} .kpi.okk .lbl::before{background:var(--ok)} .kpi.info .lbl::before{background:var(--accent)}
.kpi b{font-size:30px;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{padding-left:20px} th:last-child,td:last-child{padding-right:20px}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)}
.mono{font-family:var(--f-mono);font-size:13px}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.alert{background:var(--warn-bg);color:var(--warn)} .pill.venc{background:var(--bad-bg);color:var(--bad)} .pill.sem{background:var(--none-bg);color:var(--none)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:0}
.alist .what{min-width:0}
.alist .what b{font-weight:500}
.empty{color:var(--muted);padding:32px 8px;text-align:center}
.reqlist{list-style:none;margin:0;padding:0}
.reqlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.reqlist li:last-child{border-bottom:0}
.overlay{position:fixed;inset:0;background:rgba(32,33,36,.4);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:820px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.modal header{padding:24px 24px 6px}
.modal .body{padding:8px 24px 4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.modal .body{grid-template-columns:minmax(0,1fr)} .brandrow h1{display:none}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lab{font-size:13px;color:var(--muted)}
.f small{color:var(--muted);font-size:12px}
.modal footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:16px 24px 24px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:6px 12px;align-items:center}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink)}
.checks input{width:auto;margin-top:4px}
.ckitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:6px 14px;cursor:pointer}
.seg button.on.ok{background:var(--ok-bg);color:var(--ok)} .seg button.on.nc{background:var(--bad-bg);color:var(--bad)} .seg button.on.na{background:var(--hover);color:var(--ink)}
.warnbox{grid-column:1/-1;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13.5px}
.okbox{grid-column:1/-1;background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:30}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px}
.model{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.model b{font-size:16px;font-weight:500}
.model .tag{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* Acréscimos: alerta vermelho a 30 dias, anexos, modais largos com painel lateral, cartões de veículo e colaborador */
.pill.alert{background:var(--bad-bg);color:var(--bad)}
.pill.venc{background:var(--bad);color:#fff}
.pill.pend{background:#FEF3C7;color:#8A5A00}
tr.red td{background:#FDF3F2}
tr.red.click:hover td{background:#FBE7E5}
.kpi.warn .lbl::before{background:#E8716B}
.btn.small{padding:4px 12px;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-items:start}
@media (max-width:520px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card.red{border-color:#F3B8B3;background:#FFFBFA}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chead b{font-size:16px;font-weight:500}
.mini{width:100%;border-collapse:collapse;font-size:13.5px}
.mini td,.mini th{padding:6px 8px;border-bottom:1px solid var(--line)}
.mini th{background:transparent;font-size:12px;padding-top:0}
.mini td:first-child,.mini th:first-child{padding-left:0}
.mini td:last-child,.mini th:last-child{padding-right:0}
.mini tr:last-child td{border-bottom:0}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface);text-align:left;cursor:pointer;min-width:0}
.slot:hover{background:var(--hover)}
.slot.red{border-color:#F3B8B3;background:#FDF3F2}
.slot span.n{font-size:13px;font-weight:500}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 8px;font-size:13px;max-width:100%;background:var(--surface)}
.file a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.file img{width:56px;height:56px;object-fit:cover;border-radius:6px;display:block}
.file button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.upl{display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block}
.modal.wide{max-width:1180px}
.mbody{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;padding:8px 24px 4px}
.mbody.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.mbody{grid-template-columns:minmax(0,1fr)}}
.mmain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
@media (max-width:560px){.mmain{grid-template-columns:minmax(0,1fr)}}
.maside{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;align-content:start;min-width:0}
.maside h3{margin:0}
.rows{display:flex;flex-direction:column;gap:10px}
.rowcard{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:relative}
.rowcard .wide{grid-column:1/-1}
.rowcard label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rowcard input,.rowcard select,.rowcard textarea{padding:7px 9px;font-size:14px}
.rowcard .rm{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.rowtable .rowcard{grid-template-columns:120px minmax(0,1fr) minmax(0,2fr) 110px}
@media (max-width:700px){.rowtable .rowcard{grid-template-columns:repeat(2,minmax(0,1fr))}}
.aibox{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.aibox textarea{min-height:340px;font-size:14px;line-height:1.55}
.monthrow{display:grid;grid-template-columns:130px minmax(0,1.6fr) 130px 120px minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:860px){.monthrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.rep h3{margin-top:6px}
.rep .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.rep .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rep .stat b{display:block;font-size:26px;font-weight:400}
.rep .stat span{font-size:13px;color:var(--muted)}
.rep section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;overflow-x:auto}
.note{font-size:13px;color:var(--muted)}
.iabal{position:relative;background:#F5F6F8;border:1px solid #ECEEF2;border-radius:20px;padding:22px 26px 16px;margin:6px 0 20px}
.iabal::before{content:"";position:absolute;top:-9px;left:42px;width:16px;height:16px;background:#F5F6F8;border-left:1px solid #ECEEF2;border-top:1px solid #ECEEF2;transform:rotate(45deg)}
.iahead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.iahead h3{margin:0 0 2px}
.iatxt{columns:2 360px;column-gap:36px}
.iatxt h4{break-after:avoid;margin:14px 0 6px;font-size:12.5px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.iatxt p{margin:4px 0;font-size:14px}
.iapts{list-style:none;margin:0;padding:0;break-inside:auto}
.iapts li{position:relative;padding:0 0 8px 18px;font-size:14px;line-height:1.5;break-inside:avoid}
.iapts li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:#2E2A45}
.iafoot{margin:10px 0 0;font-size:12px}
.welcome{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding:20px 24px;border-radius:14px;background:linear-gradient(120deg,#2E2A45,#3a3560);color:#fff}
.welcome .sub{color:rgba(255,255,255,.72)}
.welcome .sub:first-child{text-transform:capitalize}
.wtitle{font-size:26px;font-weight:500;margin:2px 0 4px;color:#fff}
/* Prévia editável e mapa de riscos */
#pvRoot .overlay{z-index:26}
.pvdoc{max-width:980px}
.pvdoc header .pvtitle{font-size:22px;font-weight:500;margin:4px 0 2px;outline:none;border-radius:6px}
.pvbody{padding:8px 24px 4px;display:flex;flex-direction:column;gap:16px}
.pvsec{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.pvhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pvhead h3{margin:0;color:var(--accent);font-size:15px;outline:none;flex:1;min-width:0}
.pvt{width:100%;border-collapse:collapse;font-size:13.5px}
.pvt th,.pvt td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.pvt th{background:#2E2A45;color:#fff;font-weight:500}
.pvt.kv td:first-child{background:var(--bg);font-weight:500;width:34%}
.pvt td.pvx{width:30px;border:0;padding:2px;vertical-align:middle}
.pvt td.pvx button{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
[contenteditable="true"]{outline:none;border-radius:4px;transition:background .15s}
[contenteditable="true"]:hover{background:#FFF8DB}
[contenteditable="true"]:focus{background:#FFF3C4;box-shadow:0 0 0 2px #F2C200}
.pvt th[contenteditable="true"]:hover,.pvt th[contenteditable="true"]:focus{background:#3f3a60}
.pvtxt{min-height:64px;white-space:pre-wrap;border:1px dashed var(--line);padding:10px;font-size:14px}
.pvtxt:empty::before{content:"Escreva aqui…";color:var(--muted)}
.pvres{margin:0;font-weight:700;color:var(--bad)}.pvres.ok{color:var(--ok)}
.pvfotos{display:flex;flex-wrap:wrap;gap:8px}
.pvfotos .file img{width:96px;height:72px}
.pvass{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:24px 8px 8px}
.pvass div{display:flex;flex-direction:column;gap:6px}.pvass span{border-top:1px solid var(--ink);height:0}
.pvass b{font-weight:400;font-size:13px}
.dotx{color:var(--bad);font-size:16px}

/* Tela de entrada: foto do porto à esquerda, painel branco com logo e formulário à direita */
body.locked header.top, body.locked main{display:none}
#login[hidden],[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:15;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--surface);overflow:auto}
.lg-art{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 50% 45%,#3a3560 0%,#2E2A45 45%,#15131F 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 28px;min-height:300px}
.lg-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(circle at 50% 48%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 48%,#000 0%,transparent 70%)}
.lg-art-head{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:28px;right:28px;display:flex;justify-content:space-between;font:500 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;color:rgba(255,255,255,.62)}
.lg-svg{position:relative;width:min(100%,640px);height:auto;max-height:76vh;overflow:visible}
.lg-svg .orb{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1}
.lg-svg .orb2{fill:none;stroke:rgba(255,255,255,.06);stroke-width:1}
.lg-svg .dash{fill:none;stroke:rgba(242,194,0,.45);stroke-width:1.2;stroke-dasharray:2 7}
.lg-svg .lk{stroke:rgba(255,255,255,.2);stroke-width:1.2}
.lg-svg .pu{fill:#F2C200}
.lg-svg .halo{fill:rgba(242,194,0,.1);stroke:rgba(242,194,0,.35);stroke-width:1}
.lg-svg .ring{fill:rgba(255,255,255,.55);font:500 11.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em}
.lg-svg .nb{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.32);stroke-width:1.2}
.lg-svg .ic{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lg-svg .lb{fill:rgba(255,255,255,.88);font:500 14px Roboto,system-ui,sans-serif}
.lg-svg .nd{animation:lg-in .6s ease-out both}
.lg-svg .spin{transform-origin:300px 300px;animation:lg-spin 60s linear infinite}
.lg-svg .rot{transform-origin:300px 300px;animation:lg-spin 30s linear infinite reverse}
.lg-svg .nd:hover .nb{fill:rgba(242,194,0,.18);stroke:#F2C200}
@keyframes lg-spin{to{transform:rotate(360deg)}}
@keyframes lg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lg-art-foot{position:relative;text-align:center;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lg-art-foot b{font-weight:500;font-size:16px}
.lg-art-foot span{font-size:13px;color:rgba(255,255,255,.66)}
.lg-box>*{animation:lg-in .5s ease-out both}
.lg-box>*:nth-child(2){animation-delay:.05s}.lg-box>*:nth-child(3){animation-delay:.1s}.lg-box>*:nth-child(4){animation-delay:.15s}.lg-box>*:nth-child(5){animation-delay:.2s}
.lg-safe{margin-top:22px;display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok)}
.lg-safe b{font-size:22px;font-weight:500}.lg-safe span{font-size:13px}
.lg-foot{margin:26px 0 0;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.lg-svg .spin,.lg-svg .rot,.lg-svg .nd,.lg-box>*{animation:none!important}.lg-svg .pu{display:none}}

.lg-panel{background-color:var(--surface);background-image:linear-gradient(rgba(46,42,69,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(46,42,69,.035) 1px,transparent 1px);background-size:24px 24px}

.lg-safe{margin-top:22px;display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok)}
.lg-safe b{font-size:22px;font-weight:500}.lg-safe span{font-size:13px}
.lg-foot{margin:26px 0 0;font-size:12px;color:var(--muted)}
.lg-panel{display:flex;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 24px}
.lg-box{width:100%;max-width:400px;display:flex;flex-direction:column}
.lg-logo{height:58px;width:auto;align-self:flex-start;margin-bottom:22px}
.lg-box h1{font-size:26px;font-weight:500;margin:0 0 4px;color:var(--ink)}
.lg-lead{margin:0 0 14px;color:var(--ink)}
.lg-box form{display:flex;flex-direction:column;gap:14px}
.lg-box label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.lg-box input{font-size:16px;padding:12px 14px;border-radius:10px}
.lg-btn{padding:12px 18px;font-size:15px;margin-top:4px;width:100%}
.lg-err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.lg-msg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;margin-bottom:12px}
.lg-link{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;padding:8px 0 0;cursor:pointer;align-self:flex-start;text-decoration:underline}
.lg-team{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lg-thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lg-thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:var(--hover)}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:start}.lg-panel{align-items:flex-start;padding-top:24px}}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.whoname{display:flex;flex-direction:column;align-items:flex-end;font-size:13.5px;font-weight:500;line-height:1.2}
.whoname small{font-weight:400;color:var(--muted);font-size:12px}
@media (max-width:560px){.whoname{display:none}}

.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fieldbtn{cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-height:104px;justify-content:center}
.fieldbtn:hover{background:var(--hover)}
.fieldbtn b{font-size:18px}

async function salvar(col,id,data){
  data.atualizado=new Date().toISOString(); const old=id?S[col].find(x=>x.id===id):null;
  const mud=old?Object.keys(Object.assign({},old,data)).filter(k=>!["id","atualizado","hist","atualizadoPor"].includes(k)&&JSON.stringify(old[k]??"")!==JSON.stringify(data[k]??"")).slice(0,10):[];
  data.hist=((old&&old.hist)||data.hist||[]).slice(-29).concat([{q:data.atualizado,u:uid||"",n:sessao?sessao.nome:"",a:old?"editou":"criou",f:mud}]); data.atualizadoPor=uid||"";
  if(offline){ if(id){ const i=S[col].findIndex(x=>x.id===id); if(i>=0) S[col][i]=Object.assign({id},data); else S[col].push(Object.assign({id},data)); } else S[col].push(Object.assign({id:"tmp"+Date.now()},data)); return; }
  const ref=id?db.collection(col).doc(id):db.collection(col).doc();
  try{ await ref.set(data); return ref.id; }catch(e){
    if(e&&e.code==="invalid_argument"){ canWrite=false; throw new Error("Você só tem permissão de leitura nesta página."); }
    if(e&&e.code==="quota_exceeded") throw new Error("Limite de registros atingido. Apague registros antigos.");
    throw new Error("Não salvou. Verifique a conexão e tente de novo.");
  }
}

function st(d){ if(!d) return {k:"sem",t:"Sem data",n:9e9};

  return {k:"ok",t:"Válido até "+fmt(d),n}; }

function matriz(lista){
  const pessoas=lista.filter(c=>c.situacao!=="Desligado"); const req=new Set(); pessoas.forEach(c=>{ const g=cargoDe(c); (g&&g.treinos||[]).forEach(t=>req.add(t)); });

  pessoas.forEach(c=>{ const g=cargoDe(c), exig=new Set((g&&g.treinos)||[]);
    h+=`<tr><td style="position:sticky;left:0;background:var(--surface)"><b style="font-weight:500">${esc(c.nome)}</b><div class="sub">${esc(c.funcao||"")}</div></td>${cursos.map(k=>{ const t=tr.find(x=>x.colab===c.id&&(x.curso||"").toLowerCase()===k.toLowerCase());

  return h+`</tbody></table></div><p class="note" style="margin-top:10px">Clique em “Registrar” para lançar o certificado. “—” = não exigido pelo cargo.</p>`;

function noMes(d,m){ return (d||"").slice(0,7)===m; }
function relData(m){
  const [a,mm]=m.split("-"); const nomeMes=MESES[+mm-1]+" de "+a;
  const docs=S.documentos.filter(d=>noMes(d.emissao,m)), tr=S.treinamentos.filter(t=>noMes(t.data,m)), as=S.asos.filter(x=>noMes(x.elaboracao,m));
  const ins=S.inspecoes.filter(i=>noMes(i.data,m)), dds=S.dds.filter(d=>noMes(d.data,m));
  const osA=S.os.filter(o=>noMes(o.abertura||o.data,m)); const lan=[]; S.os.forEach(o=>(o.lancamentos||[]).forEach(x=>noMes(x.data,m)&&lan.push(Object.assign({os:o},x))));
  const camp=campDoc(+a)[+mm]||{}; const acoes=[]; ins.forEach(i=>(i.problemas||[]).forEach(p=>acoes.push(Object.assign({i},p))));
  const part=dds.reduce((s,d)=>s+(+d.qtd||0),0), gasto=lan.reduce((s,x)=>s+(+x.valor||0),0);
  const ep=S.epis.filter(x=>noMes(x.data,m)), ac=S.acidentes.filter(x=>noMes(x.data,m)), env=eventos().filter(e=>e.status==="Enviado"&&noMes(e.dataEnvio,m)), pend=pendencias();
  return {nomeMes,
   stats:[[docs.length,"documentos emitidos"],[tr.length,"treinamentos realizados"],[as.length,"ASOs realizados"],[ins.length,"inspeções ("+ins.filter(i=>i.reprovado).length+" reprovadas)"],[dds.length,"DDS · "+part+" participações"],[osA.length,"OS abertas"],[brl(gasto),"lançado nas OS"],[acoes.filter(x=>x.status==="Concluída").length+"/"+acoes.length,"ações concluídas"]],
   campanha:(camp.tema||CAMP_TEMAS[+mm-1])+" — "+(camp.status||"sem status")+(camp.data?" em "+fmt(camp.data):""),
   sections:[
    {t:"Documentos emitidos",cols:["Documento","Categoria","Emissão","Validade"],rows:docs.map(d=>[d.titulo,d.categoria||"",fmt(d.emissao),fmt(d.validade)])},
    {t:"Treinamentos",cols:["Colaborador","Curso","Turma","Data","Vencimento"],rows:tr.map(t=>[nomeColab(t.colab),t.curso,t.turma||"",fmt(t.data),fmt(t.validade)])},
    {t:"ASOs",cols:["Colaborador","Tipo","Elaboração","Vencimento","Resultado"],rows:as.map(x=>[nomeColab(x.colab),x.tipo||"",fmt(x.elaboracao),fmt(x.validade),x.resultado||""])},
    {t:"Inspeções e checklists",cols:["Data","Checklist","Alvo","Resultado","Inspetor"],rows:ins.map(i=>[fmt(i.data),(MODELOS.find(x=>x.id===i.modelo)||{}).nome||"",i.veiculo?nomeVeic(i.veiculo):(i.alvo||"")+(i.local?" · "+i.local:""),i.modelo==="livre"?"Livre":(i.reprovado?"Reprovado":"Aprovado"),i.inspetor||""])},
    {t:"Problemas e plano de ação",cols:["Problema","Ação","Responsável","Prazo","Status"],rows:acoes.map(p=>[p.desc||"",p.acao||"",p.resp||"",fmt(p.prazo),p.status||"Aberta"])},
    {t:"DDS",cols:["Data","Tema","Responsável","Participantes"],rows:dds.map(d=>[fmt(d.data),d.tema,d.responsavel||"",d.qtd||""])},
    {t:"Ordens de serviço abertas",cols:["OS","Serviço","Cliente","Status"],rows:osA.map(o=>[o.numero,o.titulo,o.cliente||"",o.status||""])},
    {t:"Lançamentos nas OS",cols:["Data","OS","Tipo","Descrição","Valor"],rows:lan.map(x=>[fmt(x.data),x.os.numero,x.tipo||"",x.desc||"",brl(x.valor)])},
    {t:"Entregas de EPI",cols:["Data","Colaborador","EPIs","Ficha assinada"],rows:ep.map(x=>[fmt(x.data),nomeColab(x.colab),(x.itens||[]).map(i=>i.epi+(i.ca?" (CA "+i.ca+")":"")).join(", "),(x.anexos||[]).length?"Sim":"Não"])},
    {t:"Acidentes e quase acidentes",cols:["Data","Classificação","Colaborador","Descrição"],rows:ac.map(x=>[fmt(x.data),x.classe||"",x.colab?nomeColab(x.colab):"—",x.descricao||""])},
    {t:"Eventos enviados ao eSocial",cols:["Evento","Colaborador","Referência","Recibo","Envio"],rows:env.map(e=>[e.cod,nomeColab(e.colab),e.ref,e.recibo||"",fmt(e.dataEnvio)])},
    {t:"Plano de ação: concluídas no mês",cols:["Ação","Origem","Prazo","Conclusão"],rows:S.acoes.filter(a=>a.situacao==="Concluída"&&noMes(a.dataConclusao,m)).map(a=>[a.titulo,a.origem||"",fmt(a.prazo),fmt(a.dataConclusao)])},
    {t:"Pendências na data de hoje",cols:["Item","Detalhe","Situação"],rows:pend.map(p=>[p.o,p.d,p.s.t])}]};
}
function relatorioHTML(m){ const R=relData(m);
  const tbl=(cols,rows)=>rows.length?`<table class="mini"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`:`<p class="note">Nenhum registro no mês.</p>`;
  return `<h3 style="font-size:18px">${R.nomeMes}</h3><div class="grid4">${R.stats.map(([v,l])=>`<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div><section><h3>Campanha do mês</h3><p style="margin:0">${esc(R.campanha)}</p></section>`+R.sections.map(x=>`<section><h3>${x.t}</h3>${tbl(x.cols,x.rows)}</section>`).join("");
}

const opt=(o,v)=>o.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");
function fieldHTML(f,v){
  const id="f-"+f.k, full=f.full?" full":"", hint=f.h?`<small>${esc(f.h)}</small>`:"";

  case "ref": { v=v||[]; const l=S[f.ref].filter(f.filter||(()=>1)); return `<div class="f full"><span class="lab">${f.l}</span>${l.length?`<div class="checks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${l.map(x=>{ const s=f.status?f.status(x):null; return `<label><input type="checkbox" data-ref="${f.k}" value="${x.id}"${v.includes(x.id)?" checked":""}> <span>${esc(x.nome)} ${s&&s.k!=="ok"?pill(s):""}</span></label>`;}).join("")}</div>`:`<small>Nada cadastrado ainda.</small>`}</div>`; }
  case "lib": v=v||{}; return `<div class="f full"><span class="lab">${f.l}</span><div class="checks">${LIB_ITENS.map((l,i)=>`<label><input type="checkbox" data-lib="${i}"${v[i]?" checked":""}> <span>${esc(l)}</span></label>`).join("")}</div></div>`;
  case "files": return `<div class="f full"><span class="lab">${f.l}</span><div class="files" data-files="${f.k}"></div>${uplBtn(f)}${hint}</div>`;
  case "rows": return `<div class="f full ${f.table?"rowtable":""}"><span class="lab">${f.l}</span>${f.h?hint:""}<div class="rows" data-rows="${f.k}"></div>${canWrite?`<button type="button" class="btn small" data-addrow="${f.k}" style="align-self:flex-start">+ ${f.add||"Adicionar"}</button>`:""}</div>`;
  case "checklist": return `<div class="f full"><span class="lab">${f.l}</span><div data-checklist>${f.itens.map((it,i)=>`<div class="ckitem"><span>${esc(it)}</span><div class="seg" role="group" aria-label="${esc(it)}">${[["ok","OK"],["nc","NC"],["na","N/A"]].map(([c,l])=>`<button type="button" class="${c}${(M.resp[i]===c)?" on":""}" data-i="${i}" data-v="${c}" aria-pressed="${M.resp[i]===c}" title="${c==="nc"?"Não conforme":l}">${l}</button>`).join("")}</div></div>`).join("")}</div><div data-ckres></div></div>`;
  case "multi": v=v||[]; return `<div class="f full"><span class="lab">${f.l}</span><div class="checks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${f.o.map(x=>`<label><input type="checkbox" data-multi="${f.k}" value="${esc(x)}"${v.includes(x)?" checked":""}> <span>${esc(x)}</span></label>`).join("")}</div></div>`;
  case "info": return `<div class="f full">${f.html}</div>`;
  default: return `<div class="f${full}"><label for="${id}">${f.l}</label><input type="${f.t}" id="${id}" data-k="${f.k}" value="${esc(v)}"${f.dl?` list="dl-${f.k}"`:""}${f.step?` step="${f.step}"`:""}>${f.dl?`<datalist id="dl-${f.k}">${f.dl.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}${hint}</div>`;
  }

function coleta(fm){ const data=Object.assign({},M.base||{},M.cfg.keep||{});
  M.fields.forEach(f=>{
    if(f.t==="ref") data[f.k]=[...fm.querySelectorAll(`[data-ref="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.t==="multi") data[f.k]=[...fm.querySelectorAll(`[data-multi="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.t==="lib"){ data.lib={}; fm.querySelectorAll("[data-lib]").forEach(i=>{ if(i.checked) data.lib[i.dataset.lib]=true; }); }
    else if(f.t==="files") data[f.k]=M.files[f.k];
    else if(f.t==="rows") data[f.k]=readRows(f.k).filter(r=>Object.values(r).some(Boolean));
    else if(f.t==="checklist"){ data.respostas=M.resp; data.reprovado=Object.values(M.resp).includes("nc"); }
    else if(f.t!=="info"){ const el=fm.querySelector(`[data-k="${f.k}"]`); if(el) data[f.k]=el.value.trim(); }
  }); return data; }

function abrir(col,id,pre){

  if(!reg){ toast("Registro não encontrado."); return; }
  if(col==="inspecoes") return abrirInsp(reg.modelo,id,reg);
  if(col==="os") return abrirOS(id,reg);
  if(col==="acidentes") return abrirAcid(id,reg);
  const T={acoes:"ação",epis:"entrega de EPI",cargos:"cargo",documentos:"documento",colaboradores:"colaborador",treinamentos:"treinamento",asos:"ASO",veiculos:"equipamento",dds:"DDS"};
  let fields=F[col];
  if(col==="colaboradores") fields=fields.map(f=>f.k==="funcao"?{k:"funcao",l:"Cargo / função",t:"text",dl:S.cargos.length?S.cargos.map(g=>g.nome):FUNCOES,h:S.cargos.length?"Use o mesmo nome do cargo para o sistema cobrar os treinamentos":""}:f);
  if(col==="cargos"){ const r=Object.assign({},reg,{episTxt:(reg.epis||[]).join("\n")}); return openForm({col,id,data:r,fields,title:id?"Cargo: "+reg.nome:"Novo cargo",sideTitle:"Exames e EPIs",onSave:async d=>{ d.epis=(d.episTxt||"").split(/\n/).map(x=>x.trim()).filter(Boolean); delete d.episTxt; return await salvar("cargos",id,d); }}); }
  if((col==="treinamentos"||col==="asos")&&!id&&pre&&pre.colab){ fields=fields.map(f=>f.k==="colab"?Object.assign({},f):f); }
  if(col==="acoes") return openForm({col,id,data:Object.assign({situacao:"Pendente",prioridade:"Média"},reg),fields,title:id?"Ação":"Nova ação",sideTitle:"Conclusão e evidências",validate:d=>d.situacao==="Concluída"&&!(d.evidencias||[]).length&&!d.conclusao?"Para concluir, descreva o que foi feito ou anexe a evidência.":null});
  if(col==="documentos"){ return openForm({col,id,data:Object.assign({situacao:SIT_DOC[0]},reg),fields,title:(id?"Editar ":"Novo ")+"documento",
    validate:d=>d.situacao===VALID&&(reg.situacao!==VALID)&&!isAdmin?"Somente a equipe de SST (quem edita) pode validar um documento.":null,
    onSave:async d=>{ if(d.situacao===VALID&&reg.situacao!==VALID){ d.validadoPor=uid||""; d.validadoEm=hojeISO(); } return await salvar("documentos",id,d); }}); }
  if(col==="asos"){ const keep={}; if(reg.esocial) keep.esocial=reg.esocial; return openForm({col,id,data:reg,fields,keep,title:(id?"Editar ":"Novo ")+T[col],onSave:async d=>{ if(!d.validade&&d.elaboracao&&d.tipo!=="Demissional"){ const c=S.colaboradores.find(x=>x.id===d.colab), g=c&&cargoDe(c), m=+(g&&g.asoMeses)||12; const x=new Date(d.elaboracao+"T12:00:00"); x.setMonth(x.getMonth()+m); d.validade=x.toISOString().slice(0,10); } return await salvar("asos",id,d); }}); }
  const keep={}; if(reg.esocial) keep.esocial=reg.esocial; if(reg.s2240) keep.s2240=reg.s2240;
  openForm({col,id,data:reg,fields,keep,title:(id?"Editar ":"Novo ")+T[col]});
}

async function baixarWord(titulo,texto){
  if(!texto){ toast("Não há conteúdo para baixar."); return; }
  const dl=cl?await cl.use("downloads"):null; if(!dl){ toast("Download disponível apenas abrindo pelo claude.ai."); return; }
  const body=esc(texto).split(/\n/).map(l=>/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9 .,\-–—/()]{6,}$/.test(l.trim())?`<h2>${l}</h2>`:l.trim()?`<p>${l}</p>`:"").join("");
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>body{font-family:Arial;font-size:11pt}h1{font-size:15pt}h2{font-size:12pt;margin-top:14pt}p{margin:3pt 0}</style></head><body><h1>${esc(titulo)}</h1><p><i>Premium Locação de Guindastes e Transportes</i></p>${body}</body></html>`;
  try{ await dl.save({filename:titulo.replace(/[^\wÀ-ú -]/g,"").slice(0,60).trim()+".doc",data:new Blob(["﻿"+html],{type:"application/msword"})}); }catch(e){ toast("Download cancelado ou não permitido."); }
}

function valorCampo(f,v){
  if(v==null||v==="") return "";

  if(f.t==="sel") { const x=S[f.ref].find(y=>y.id===v); return x?(f.lab?f.lab(x):x.nome):""; }
  if(f.t==="ref") return (v||[]).map(id=>{ const x=S[f.ref].find(y=>y.id===id); return x?x.nome:""; }).filter(Boolean).join(", ");
  if(f.t==="multi") return (v||[]).join(", ");
  return String(v); }

   after:fm=>{ const sel=fm.querySelector('[data-k="tipo"]'), info=fm.querySelector("#impInfo"); const up=()=>{ const t=IMP[sel.value]||IMP.Colaboradores; info.innerHTML=`Colunas, nesta ordem: <b>${t.cols}</b>.<br>No Excel, selecione as linhas, copie (Ctrl+C) e cole abaixo (Ctrl+V). Exemplo de linha: <span class="mono">${esc(t.ex.replace(/\t/g,"  |  "))}</span>`; }; sel.onchange=up; up(); },
   onSave:async d=>{
    const linhas=(d.dados||"").split(/\r?\n/).map(l=>l.split(/\t|;/).map(x=>x.trim())).filter(l=>l[0]);
    if(!linhas.length) throw new Error("Cole pelo menos uma linha.");
    const porNome={}; S.colaboradores.forEach(c=>porNome[(c.nome||"").toLowerCase()]=c.id);
    const garante=async nome=>{ const k=nome.toLowerCase(); if(porNome[k]) return porNome[k]; const id=await salvar("colaboradores",null,{nome,situacao:"Ativo"}); porNome[k]=id; return id; };
    let n=0;
    for(const l of linhas){
      if(d.tipo==="Colaboradores"){ const k=l[0].toLowerCase(); const body={nome:l[0],funcao:l[1]||"",base:l[2]||"",admissao:dataBR(l[3]),situacao:"Ativo"}; if(porNome[k]){ const old=S.colaboradores.find(c=>c.id===porNome[k])||{}; const b=Object.assign({},old,body); delete b.id; await salvar("colaboradores",porNome[k],b); } else { porNome[k]=await salvar("colaboradores",null,body); } }
      else if(d.tipo==="Treinamentos"){ const id=await garante(l[0]); await salvar("treinamentos",null,{colab:id,curso:l[1]||"",turma:l[2]||"",data:dataBR(l[3]),validade:dataBR(l[4]),anexos:[]}); }
      else { const id=await garante(l[0]); await salvar("asos",null,{colab:id,tipo:l[1]||"Periódico",elaboracao:dataBR(l[2]),validade:dataBR(l[3]),resultado:l[4]||"Apto",anexos:[]}); }
      n++; }
    M.cfg.okMsg=()=>n+" linha(s) importada(s).";
   }});
}
async function impresso(tipo,colabId){
  const c=S.colaboradores.find(x=>x.id===colabId); if(!c) return; const g=cargoDe(c);
  if(!g){ toast("Defina o cargo do colaborador com o mesmo nome de um cargo da aba Cargos e riscos."); return; }
  const dl=cl?await cl.use("downloads"):null; if(!dl){ toast("Download disponível apenas abrindo pelo claude.ai."); return; }
  const cab=`<table style="width:100%;border-collapse:collapse;margin-bottom:10pt"><tr><td style="border:1px solid #999;padding:6pt"><b>PREMIUM LOCAÇÃO DE GUINDASTES E TRANSPORTES</b><br>Av. Santos Dumont, 80, salas 201 a 204, Tirirical, São Luís – MA</td></tr></table>`;
  const id=`<table style="width:100%;border-collapse:collapse" border="1" cellpadding="5"><tr><td><b>Colaborador:</b> ${esc(c.nome)}</td><td><b>Cargo:</b> ${esc(g.nome)}${g.cbo?" (CBO "+esc(g.cbo)+")":""}</td></tr><tr><td><b>Admissão:</b> ${fmt(c.admissao)}</td><td><b>Base:</b> ${esc(c.base||"")}</td></tr></table>`;
  let titulo, corpo;
  if(tipo==="epi"){ titulo="Ficha de controle de EPI";
    corpo=`<p>Declaro ter recebido os Equipamentos de Proteção Individual abaixo, ter sido treinado sobre o uso correto, guarda e conservação, e estar ciente de que devo usá-los durante toda a jornada, conforme a NR-06 e o art. 158 da CLT. Comprometo-me a devolvê-los quando danificados ou ao final do contrato.</p>
    <table style="width:100%;border-collapse:collapse" border="1" cellpadding="5"><tr style="background:#eee"><th>EPI</th><th>CA</th><th>Qtd.</th><th>Data de entrega</th><th>Data de devolução</th><th>Assinatura</th></tr>${(g.epis||[]).concat(["","",""]).map(e=>`<tr><td>${esc(e)}&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>`).join("")}</table>
    <p style="margin-top:30pt">São Luís – MA, ____/____/________</p><p style="margin-top:30pt">_______________________________<br>${esc(c.nome)}</p>`; }
  else { titulo="Ordem de serviço de Segurança e Saúde no Trabalho (NR-01)";
    corpo=`<p><b>Atividades do cargo:</b> ${esc(g.descricao||"")}</p><h2>RISCOS DA ATIVIDADE E MEDIDAS DE CONTROLE</h2>
    <table style="width:100%;border-collapse:collapse" border="1" cellpadding="5"><tr style="background:#eee"><th>Tipo</th><th>Perigo / agente</th><th>Fonte</th><th>Medida de prevenção</th></tr>${(g.riscos||[]).map(r=>`<tr><td>${esc(r.tipo)}</td><td>${esc(r.agente)}</td><td>${esc(r.fonte||"")}</td><td>${esc(r.medida||"")}</td></tr>`).join("")}</table>
    <h2>EPIs OBRIGATÓRIOS</h2><p>${(g.epis||[]).map(esc).join("; ")||"Não se aplica."}</p>
    <h2>TREINAMENTOS OBRIGATÓRIOS</h2><p>${(g.treinos||[]).map(esc).join("; ")||"Integração de segurança."}</p>
    <h2>É OBRIGAÇÃO DO EMPREGADO</h2><p>- Cumprir as normas e procedimentos de segurança da empresa e do cliente.<br>- Usar os EPIs fornecidos e zelar por sua conservação.<br>- Participar dos DDS, treinamentos e exames médicos.<br>- Comunicar imediatamente qualquer acidente, quase acidente ou condição insegura.<br>- Exercer o direito de recusa diante de risco grave e iminente, comunicando a liderança.</p>
    <h2>É PROIBIDO</h2><p>- Permanecer ou transitar sob carga suspensa.<br>- Operar equipamento sem treinamento e autorização.<br>- Iniciar serviço sem APR e, quando exigida, Permissão de Trabalho.<br>- Trabalhar sob efeito de álcool ou drogas.<br>- Remover ou burlar dispositivos de segurança (LMI, fim de curso, travas).</p>
    <h2>EM CASO DE ACIDENTE</h2><p>Interromper a atividade, acionar a liderança e o técnico de segurança, prestar os primeiros socorros se treinado e preservar o local para investigação.</p>
    <p style="margin-top:20pt">Declaro ter recebido e compreendido esta Ordem de Serviço.</p><p style="margin-top:30pt">São Luís – MA, ____/____/________</p><table style="width:100%;margin-top:30pt"><tr><td>_____________________________<br>${esc(c.nome)}</td><td>_____________________________<br>Responsável pela empresa</td></tr></table>`; }
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${titulo}</title><style>body{font-family:Arial;font-size:10.5pt}h1{font-size:14pt;text-align:center}h2{font-size:11pt;margin-top:12pt}th{text-align:left}</style></head><body>${cab}<h1>${titulo}</h1>${id}${corpo}</body></html>`;
  try{ await dl.save({filename:(tipo==="epi"?"Ficha de EPI - ":"OS de SST - ")+c.nome.replace(/[^\wÀ-ú ]/g,"")+".doc",data:new Blob(["\ufeff"+html],{type:"application/msword"})}); }catch(e){ toast("Download cancelado ou não permitido."); }
}

   epi:"M3 17.5h18M5 17.5c0-4.8 3.1-8.2 7-8.2s7 3.4 7 8.2M10 9.4V6.5h4v2.9M8 14c.5-1.7 1.4-2.9 2.8-3.6",

   trein:"M2.5 9 12 5l9.5 4-9.5 4zM6.5 11v4.6c1.5 1.4 3.5 2 5.5 2s4-.6 5.5-2V11M21.5 9v5",
   dds:"M4 5h16v10H9.5L5 19v-4H4zM8 9h8M8 12h5",
   acid:"M12 3.6 2.6 20h18.8zM12 10v4.6M12 17.1v.2"};
  const N=[["epi","EPI"],["saude","Saúde · ASO"],["insp","Inspeções"],["docs","PGR · PCMSO"],["equip","Equipamentos"],["trein","Treinamentos"],["dds","DDS"],["acid","Acidentes · CAT"]];
  let lines="",nodes="",pulses="";
  N.forEach(([k,l],i)=>{ const a=(-90+i*45)*Math.PI/180, x=C+R*Math.cos(a), y=C+R*Math.sin(a), hx=C+92*Math.cos(a), hy=C+92*Math.sin(a), nx=C+(R-40)*Math.cos(a), ny=C+(R-40)*Math.sin(a);
    lines+=`<line x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" class="lk"/>`;
    pulses+=`<circle r="3" class="pu" opacity="0"><set attributeName="opacity" to="1" begin="${(i*0.33).toFixed(2)}s"/><animateMotion dur="2.6s" begin="${(i*0.33).toFixed(2)}s" repeatCount="indefinite" path="M${hx.toFixed(1)},${hy.toFixed(1)} L${nx.toFixed(1)},${ny.toFixed(1)}"/></circle>`;
    const lx=C+(R+64)*Math.cos(a), ly=C+(R+64)*Math.sin(a)+4, anc=Math.abs(Math.cos(a))<.2?"middle":(Math.cos(a)>0?"start":"end"), lxx=anc==="middle"?x:(Math.cos(a)>0?x+50:x-50), lyy=anc==="middle"?(Math.sin(a)<0?y-52:y+62):y+5;
    nodes+=`<g class="nd" style="animation-delay:${(0.15+i*0.07).toFixed(2)}s"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="38" class="nb"/><g transform="translate(${(x-18).toFixed(1)} ${(y-18).toFixed(1)}) scale(1.5)"><path d="${I[k]}" class="ic"/></g><text x="${lxx.toFixed(1)}" y="${lyy.toFixed(1)}" text-anchor="${anc}" class="lb">${l}</text></g>`; });
  let ticks=""; for(let t=0;t<72;t++){ const a=t*5*Math.PI/180, r1=R+(t%9===0?-10:-5), r2=R+0; }
  return `<svg class="lg-svg" viewBox="-40 -20 680 640" role="img" aria-label="Símbolo do sistema de segurança: a marca Premium no centro, ligada a EPI, saúde e ASO, inspeções, PGR e PCMSO, equipamentos, treinamentos, DDS e acidentes">
   <defs><radialGradient id="hubg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F2C200"/></radialGradient>
   <path id="hubtxt" d="M${C},${C} m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0"/></defs>
   <circle cx="${C}" cy="${C}" r="${R}" class="orb"/><circle cx="${C}" cy="${C}" r="${R+26}" class="orb2"/>
   <g class="rot"><circle cx="${C}" cy="${C}" r="${R-118}" class="dash"/></g>

   <g class="spin"><text class="ring"><textPath href="#hubtxt" textLength="748" lengthAdjust="spacing">PREVENIR · PROTEGER · CUMPRIR · CUIDAR DE PESSOAS · PREVENIR · PROTEGER · CUMPRIR ·</textPath></text></g>
   <circle cx="${C}" cy="${C}" r="88" class="halo"/><circle cx="${C}" cy="${C}" r="74" fill="url(#hubg)"/>
   <image href="${PMONO_NAVY}" x="${C-26}" y="${C-36}" width="52" height="72"/>
   ${nodes}</svg>`;
}
function diasSemAcidente(){ if(!loaded.acidentes||offline) return null; const u=S.acidentes.filter(x=>/afastamento/.test(x.classe||"")&&!/sem afastamento/i.test(x.classe||"")).map(x=>x.data).sort().pop(); return u?Math.max(0,Math.round((hoje-new Date(u+"T12:00:00"))/864e5)):null; }
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function hashSenha(senha,salt){ const enc=new TextEncoder(); const key=await crypto.subtle.importKey("raw",enc.encode(senha),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:150000,hash:"SHA-256"},key,256)); }
const novoSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
function aplicarPerfil(){ const p=sessao?sessao.perfil:""; isAdmin=platAdmin&&(p===PERFIS[0]||p==="Demonstração"); canWrite=platWrite&&p!==PERFIS[2]; }
function abrirSessao(c){ sessao={id:c.id,nome:c.nome,perfil:c.perfil,tratamento:c.tratamento||"",exp:Date.now()+12*3600e3}; try{ sessionStorage.setItem("sst-sessao",JSON.stringify(sessao)); }catch(e){} aplicarPerfil(); renderTabs(); render(); }
function restaurarSessao(){ try{ const x=JSON.parse(sessionStorage.getItem("sst-sessao")||"null"); if(x&&x.exp>Date.now()){ sessao=x; aplicarPerfil(); renderTabs(); } }catch(e){} }
function sair(){ if(M){ M=null; mroot.innerHTML=""; } sessao=null; try{ sessionStorage.removeItem("sst-sessao"); }catch(e){} isAdmin=platAdmin; canWrite=platWrite; loginMode=""; renderTabs(); render(); }
document.addEventListener("click",e=>{ if(e.target.id==="sair") sair(); if(e.target.id==="minhaSenha") formConta(sessao.id,"senha"); });
let falhas=0, bloqueioAte=0;
function renderLogin(){
  const ready=loaded.contas||offline; const mode=!ready?"loading":offline?"demo":S.contas.length?"login":(platAdmin?"first":"semconta");
  if(mode===loginMode) return; loginMode=mode;
  let el=document.getElementById("login"); if(!el){ el=document.createElement("div"); el.id="login"; document.body.appendChild(el); } el.hidden=false;
  const logo=document.querySelector(".brandrow img").src;
  let form="";
  if(mode==="loading") form=`<p class="sub">Carregando…</p>`;
  else if(mode==="semconta") form=`<div class="lg-msg">O acesso ainda não foi configurado. Peça ao administrador do sistema para criar o seu usuário.</div>`;
  else if(mode==="demo") form=`<div class="lg-msg">Você está vendo uma cópia de demonstração. Abra o sistema pelo link do claude.ai, conectado à sua conta, para entrar com usuário e senha.</div><button class="btn primary lg-btn" id="lgDemo">Entrar em modo demonstração</button>`;
  else if(mode==="first") form=`<p class="lg-lead">Primeiro acesso: crie o usuário do administrador do sistema.</p><form id="lgForm" novalidate><label>Nome completo<input id="lgNome" autocomplete="name" required></label><label>Usuário<input id="lgUser" autocomplete="username" autocapitalize="none" required></label><label>Senha<input id="lgPass" type="password" autocomplete="new-password" required></label><label>Confirmar senha<input id="lgPass2" type="password" autocomplete="new-password" required></label><div class="lg-err" id="lgErr" role="alert"></div><button class="btn primary lg-btn" type="submit">Criar acesso e entrar</button></form>`;
  else form=`<form id="lgForm" novalidate><label>Usuário<input id="lgUser" autocomplete="username" autocapitalize="none" required></label><label>Senha<input id="lgPass" type="password" autocomplete="current-password" required></label><div class="lg-err" id="lgErr" role="alert"></div><button class="btn primary lg-btn" type="submit">Entrar</button></form><p class="note" style="margin:10px 0 0">Esqueceu a senha? O administrador redefine em Administração.</p>`;
  el.className="login";
  const ds=diasSemAcidente();
  el.innerHTML=`<div class="lg-art"><div class="lg-art-head"><span>SISTEMA DE GESTÃO DE SST</span><span>NR-01 · ISO 45001</span></div>${sstArte()}<div class="lg-art-foot"><b>Todas as frentes da segurança, em um só lugar.</b><span>Pessoas, equipamentos, documentos e operações conectados.</span></div></div>
   <div class="lg-panel"><div class="lg-box"><img class="lg-logo" src="${logo}" alt="Premium Locação — Guindastes e Transportes"><h1>Segurança do Trabalho</h1><p class="sub" style="margin:0 0 22px">Sistema de gestão de SST da Premium Locação</p>${form}${ds!=null?`<div class="lg-safe"><b>${ds}</b><span>${ds===1?"dia":"dias"} sem acidente com afastamento</span></div>`:""}<p class="lg-foot">Segurança e Saúde do Trabalho · Premium Locação de Guindastes e Transportes</p></div></div>`;
  const f=el.querySelector("#lgForm"); if(f){ setTimeout(()=>{ const i=el.querySelector("input"); if(i) i.focus(); },50); f.onsubmit=async ev=>{ ev.preventDefault(); const err=el.querySelector("#lgErr"); err.textContent=""; const btn=f.querySelector("button[type=submit]");
    const u=el.querySelector("#lgUser").value.trim().toLowerCase(), pw=el.querySelector("#lgPass").value;
    if(mode==="first"){ const nome=el.querySelector("#lgNome").value.trim(), pw2=el.querySelector("#lgPass2").value;
      if(!nome||!u){ err.textContent="Preencha nome e usuário."; return; } if(pw.length<6){ err.textContent="A senha precisa ter pelo menos 6 caracteres."; return; } if(pw!==pw2){ err.textContent="As senhas não conferem."; return; }
      btn.disabled=true; btn.textContent="Criando…"; try{ const salt=novoSalt(); const c={nome,usuario:u,perfil:PERFIS[0],ativo:"Sim",salt,hash:await hashSenha(pw,salt)}; const id=await salvar("contas",null,c); abrirSessao(Object.assign({id},c)); }catch(x){ err.textContent=x.message||"Não foi possível criar o acesso."; btn.disabled=false; btn.textContent="Criar acesso e entrar"; } return; }
    if(Date.now()<bloqueioAte){ err.textContent="Muitas tentativas. Aguarde "+Math.ceil((bloqueioAte-Date.now())/1000)+" segundos."; return; }
    if(!u||!pw){ err.textContent="Informe usuário e senha."; return; }
    btn.disabled=true; btn.textContent="Entrando…";
    const c=S.contas.find(x=>(x.usuario||"").toLowerCase()===u&&x.ativo!=="Não"); let ok=false; try{ ok=!!c&&(await hashSenha(pw,c.salt))===c.hash; }catch(x){}
    if(ok){ falhas=0; abrirSessao(c); if(c.trocarSenha==="Sim"&&platAdmin) setTimeout(()=>{ formConta(c.id,"senha"); toast("Primeiro acesso: crie uma senha pessoal."); },200); return; }
    falhas++; if(falhas>=5){ bloqueioAte=Date.now()+60000; falhas=0; } err.textContent="Usuário ou senha incorretos."; btn.disabled=false; btn.textContent="Entrar"; }; }
  const d=el.querySelector("#lgDemo"); if(d) d.onclick=()=>abrirSessao({id:"demo",nome:"Demonstração",perfil:"Demonstração"});
}
function formConta(id,op){
  const c=id?S.contas.find(x=>x.id===id):null;
  if(c&&op==="senha") return openForm({title:"Redefinir senha",eyebrow:c.nome+" · "+c.usuario,del:false,noPdf:1,data:{},saveLabel:"Salvar nova senha",fields:[{k:"senha",l:"Nova senha",t:"password",req:1},{k:"senha2",l:"Confirmar",t:"password",req:1}],
    validate:d=>d.senha.length<6?"A senha precisa ter pelo menos 6 caracteres.":d.senha!==d.senha2?"As senhas não conferem.":null,
    onSave:async d=>{ const b=Object.assign({},c); delete b.id; b.salt=novoSalt(); b.hash=await hashSenha(d.senha,b.salt); b.trocarSenha=(sessao&&sessao.id===c.id)?"Não":"Sim"; await salvar("contas",c.id,b); },okMsg:()=>"Senha redefinida"});
  openForm({title:c?"Editar usuário":"Novo usuário",del:false,noPdf:1,data:c?{nome:c.nome,usuario:c.usuario,perfil:c.perfil,ativo:c.ativo||"Sim",tratamento:c.tratamento||"Boas-vindas"}:{perfil:PERFIS[1],ativo:"Sim",tratamento:"Boas-vindas"},fields:[
    {k:"nome",l:"Nome completo",t:"text",req:1,full:1},{k:"usuario",l:"Usuário",t:"text",req:1,h:"Sem espaços. Ex.: joao.silva"},{k:"perfil",l:"Perfil",t:"select",o:PERFIS},
    {k:"ativo",l:"Situação",t:"select",o:["Sim","Não"],h:"“Não” bloqueia o login"},{k:"tratamento",l:"Saudação no painel",t:"select",o:["Bem-vinda","Bem-vindo","Boas-vindas"]},...(c?[]:[{k:"senha",l:"Senha inicial",t:"password",req:1},{k:"senha2",l:"Confirmar senha",t:"password",req:1}]),
    {k:"_i",l:"",t:"info",html:`<p class="note" style="margin:0"><b>SST (administrador):</b> vê e edita tudo, inclusive ASOs. <b>Gestor / encarregado:</b> preenche checklists, inspeções, DDS, OS e ocorrências; não vê ASOs. <b>Diretoria (consulta):</b> só consulta.</p>`}],
   validate:d=>{ d.usuario=(d.usuario||"").toLowerCase().replace(/\s+/g,""); if(S.contas.some(x=>x.usuario===d.usuario&&x.id!==id)) return "Esse usuário já existe."; if(!c){ if((d.senha||"").length<6) return "A senha precisa ter pelo menos 6 caracteres."; if(d.senha!==d.senha2) return "As senhas não conferem."; } return null; },
   onSave:async d=>{ const b=c?Object.assign({},c):{}; delete b.id; Object.assign(b,{nome:d.nome,usuario:d.usuario,perfil:d.perfil,ativo:d.ativo,tratamento:d.tratamento}); if(!c){ b.salt=novoSalt(); b.hash=await hashSenha(d.senha,b.salt); b.trocarSenha="Sim"; } await salvar("contas",id,b); },okMsg:()=>c?"Usuário atualizado":"Usuário criado"});
}
init();

</script>
</body></html>
